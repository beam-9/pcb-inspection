[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-inspection"
version = "0.1.0"
description = "Bounded VisA PCB1 visual anomaly feasibility pilot"
requires-python = ">=3.11,<3.12"
dependencies = ["torch", "torchvision", "numpy", "pandas", "scikit-learn", "Pillow", "pydantic", "pyyaml", "pyarrow", "requests", "psutil"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbclient", "ipykernel", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
