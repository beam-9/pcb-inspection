image_threshold_quantile: 0.95
pixel_threshold_quantile: 0.99
quantile_method: higher
threshold_comparison: strict_greater
resize: direct_bilinear_square_no_crop
mask_resize: nearest
map_resize: bilinear_align_corners_false
map_normalization: none
max_debug_runs: 3
