category: pcb1
seed: 42
input_size: 256
backbone: resnet18
weights: IMAGENET1K_V1
feature_layers: [layer2, layer3]
device: cpu
threads: 4
memory_cap: 4096
memory_sampling: deterministic_uniform_without_replacement
